<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>小葉音樂劇/戲曲劇本寫作工坊</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/abcjs@6.4.4/abcjs-audio.css">
<style>
:root{
  --bg:#ECEAE4; --paper:#FFFFFF; --ink:#1F1D1A; --ink2:#5B574F; --ink3:#9A958A;
  --line:#D9D5CC; --accent:#8A3B2E; --accent-l:#F5E6E2; --teal:#2E6E73; --teal-l:#E2F0F0;
  --band:#EFEDE8; --sel:#C0392B;
  --serif:"Noto Serif TC","Songti TC","PMingLiU","MingLiU",serif;
  --kai:"BiauKai","Kaiti TC","DFKai-SB","標楷體",var(--serif);
  --sans:-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px}
button,select,input{font-family:inherit;font-size:13px}
button{cursor:pointer;border:1px solid var(--line);background:#fff;border-radius:6px;padding:5px 10px;color:var(--ink)}
button:hover{border-color:var(--ink3)}
button.on{background:var(--accent-l);border-color:var(--accent);color:var(--accent)}
select,input[type=text],input[type=number]{border:1px solid var(--line);border-radius:6px;padding:4px 6px;background:#fff}

/* ── 上方工具列 ── */
#top{position:sticky;top:0;z-index:20;background:#F7F6F2;border-bottom:1px solid var(--line)}
.row{display:flex;align-items:center;gap:8px;padding:8px 14px;flex-wrap:wrap}
.row + .row{border-top:1px solid var(--line);padding-top:6px;padding-bottom:6px}
#title{font-size:16px;font-weight:600;width:220px;border:none;background:transparent;border-bottom:1px dashed var(--line);border-radius:0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.seg button{border:none;border-radius:0;padding:5px 12px}
.seg button + button{border-left:1px solid var(--line)}
.spacer{flex:1}
#status{color:var(--ink3);font-size:12px}
.el-btn{display:inline-flex;align-items:center;gap:6px}
.el-btn kbd{font-family:var(--sans);font-size:11px;color:var(--ink3);background:var(--band);border-radius:4px;padding:1px 5px}
.el-btn.on kbd{background:#fff}
.hide{display:none!important}
/* 長按有選單的按鈕：右下角小三角（像 Photoshop 工具列） */
.el-btn.has-menu{position:relative}
.el-btn.has-menu::after{content:'';position:absolute;right:3px;bottom:3px;border:3px solid transparent;border-right-color:var(--ink3);border-bottom-color:var(--ink3)}
#amarkMenu{position:fixed;z-index:60;background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:0 6px 20px rgba(0,0,0,.14);padding:4px;min-width:150px;font-size:13px}
#amarkMenu .t{font-size:11px;color:var(--ink3);padding:4px 8px 2px}
#amarkMenu button{display:flex;width:100%;border:none;background:transparent;text-align:left;padding:6px 8px;border-radius:5px;gap:8px}
#amarkMenu button:hover{background:var(--band)}
#amarkMenu button .ck{width:1em;color:var(--accent)}

/* ── 版面 ── */
#layout{display:flex;align-items:flex-start;gap:20px;padding:24px 16px 80px;max-width:1200px;margin:0 auto}
#nav{position:sticky;top:110px;width:200px;flex:0 0 200px;max-height:calc(100vh - 130px);overflow:auto;font-size:13px}
#nav h3{font-size:12px;color:var(--ink3);font-weight:600;margin:0 0 6px}
#nav a{display:block;padding:3px 6px;border-radius:5px;color:var(--ink2);text-decoration:none;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#nav a:hover{background:#fff}
#nav a.scene{font-weight:600;color:var(--ink);margin-top:6px}
#nav a.song{padding-left:16px}
#nav .count{color:var(--ink3);font-size:12px;margin-top:10px}
#paper{flex:1;max-width:210mm;min-height:297mm;background:var(--paper);box-shadow:0 1px 3px rgba(0,0,0,.12),0 6px 24px rgba(0,0,0,.06);padding:25mm 25mm 30mm 32mm}
@media (max-width:900px){#nav{display:none}#paper{padding:18px}}

/* ── 劇本元素 ── */
.ProseMirror{outline:none;font-family:var(--serif);font-size:16px;line-height:1.85;counter-reset:song;white-space:pre-wrap;word-break:break-word}
.ln{position:relative}
.ln-text{margin:0;min-height:1.85em}
.ln[data-kind=scene] .ln-text{font-weight:700;margin-top:1.4em}
.ln[data-kind=action] .ln-text::before{content:var(--amark,'▲');color:var(--ink2);margin-right:.2em}
body.amark-none .ln[data-kind=action] .ln-text::before{content:none}
body.amark-paren .ln[data-kind=action] .ln-text::before{content:'（'}
body.amark-paren .ln[data-kind=action] .ln-text::after{content:'）';color:var(--ink2)}
.ln[data-kind=speech] .who,.ln[data-kind=lyric] .who{font-weight:700}
.ln[data-kind=singer] .ln-text{font-weight:700;padding-left:2em;margin-top:.3em}
.ln[data-kind=song]{margin-top:1em}
.ln[data-kind=song]:not([data-reprise="1"]){counter-increment:song}
.ln[data-kind=song] .ln-text{padding-left:2em;font-weight:700;padding-right:120px}
.ln[data-kind=song] .ln-text::before{content:'【'}
.ln[data-kind=song] .ln-text::after{content:'】'}
.ln[data-kind=song][data-reprise="1"] .ln-text{padding-left:3em}
.ln[data-kind=song][data-reprise="1"] .ln-text::before{content:'續【'}
.ln[data-kind=lyric] .ln-text{padding-left:2em}
/* 音樂劇：歌名用編號灰底橫幅、歌詞改楷體並更深縮排 */
body.mode-musical .ln[data-kind=song] .ln-text{background:var(--band);padding-left:.6em;border-radius:3px}
body.mode-musical .ln[data-kind=song] .ln-text::before{content:'# ' counter(song,decimal-leading-zero) '　【'}
body.mode-musical .ln[data-kind=song][data-reprise="1"] .ln-text::before{content:'#　續【'}
body.mode-musical .ln[data-kind=lyric] .ln-text{padding-left:4em;font-family:var(--kai)}
body.mode-musical .ln[data-kind=singer] .ln-text{padding-left:4em}
.note{font-size:.82em;color:var(--ink3)}
/* 目前所在行：左邊顯示元素名稱 */
.ln.cur::before{content:attr(data-label);position:absolute;left:-74px;top:.35em;font-family:var(--sans);font-size:11px;color:var(--accent);width:64px;text-align:right}
@media (max-width:900px){.ln.cur::before{display:none}}
/* 空白行提示字 */
.ln.is-empty.cur .ln-text::after{color:var(--ink3);font-weight:400;pointer-events:none}
.ln.is-empty.cur[data-kind=scene] .ln-text::after{content:'場次標題（例：第一場　廟埕　日）'}
.ln.is-empty.cur[data-kind=action] .ln-text::after{content:'動作指示'}
.ln.is-empty.cur[data-kind=speech] .ln-text::after{content:'角色：對白（打完角色名按 Tab 自動補「：」）'}
.ln.is-empty.cur[data-kind=song] .ln-text::after{content:'歌名／曲牌】'}
.ln.is-empty.cur[data-kind=singer] .ln-text::after{content:'唱者'}
.ln.is-empty.cur[data-kind=lyric] .ln-text::after{content:'歌詞'}

/* 歌名行右側的旋律按鈕（便利貼） */
.song-tools{position:absolute;right:4px;top:3px;display:flex;gap:4px;font-family:var(--sans)}
.song-tools button{font-size:12px;padding:2px 8px;background:#fff}
.song-tools .has{background:var(--teal-l);border-color:var(--teal);color:var(--teal)}
.song-preview{margin:4px 0 6px 2em;border-left:3px solid var(--teal-l);padding-left:8px;cursor:pointer;user-select:none}
.song-preview svg{max-width:100%}
.song-preview{max-width:420px}
body.mode-musical .song-preview{margin-left:4em}

/* ── 對話框 ── */
.overlay{position:fixed;inset:0;background:rgba(30,28,24,.45);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
.dialog{background:#fff;border-radius:12px;box-shadow:0 10px 40px rgba(0,0,0,.25);max-width:100%;max-height:calc(100vh - 32px);overflow:auto}
#chooser .dialog{padding:28px 30px;width:520px;text-align:center}
#chooser h2{margin:0 0 6px;font-family:var(--serif)}
#chooser p{color:var(--ink2);margin:0 0 18px}
#chooser .big{display:flex;gap:14px;justify-content:center}
#chooser .big button{width:200px;padding:18px 10px;font-size:16px;border-radius:10px}
#chooser .big button small{display:block;color:var(--ink3);font-size:12px;margin-top:6px}
#help .dialog{padding:22px 26px;width:560px}
#help table{border-collapse:collapse;width:100%;font-size:13px}
#help td{padding:5px 6px;border-bottom:1px solid var(--band)}
#help td:first-child{white-space:nowrap;width:150px}
#help h3{margin:14px 0 6px;font-size:14px}

/* 五線譜編輯器 */
#music .dialog{width:860px;padding:18px 22px}
#lib{z-index:70}
#lib .dialog{width:560px;padding:18px 22px}
#libSearch{width:100%;font-size:15px;padding:7px 10px;margin:8px 0}
#libList{max-height:52vh;overflow:auto;border:1px solid var(--line);border-radius:8px}
#libList .it{display:flex;align-items:center;gap:8px;padding:7px 10px;border-bottom:1px solid var(--band)}
#libList .it:last-child{border-bottom:none}
#libList .it .nm{flex:1;font-weight:600}
#libList .it .meta{font-size:12px;color:var(--ink3);font-weight:400;margin-left:6px}
#libList .empty{padding:16px;color:var(--ink3);text-align:center}
#libSuggest{background:var(--teal-l);border:1px solid var(--teal);color:var(--teal);border-radius:8px;padding:6px 10px;font-size:13px;display:flex;gap:10px;align-items:center}
#libSuggest button{background:#fff}
#music h2{margin:0;font-size:17px;font-family:var(--serif)}
.mrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:10px 0}
.mrow label{font-size:12px;color:var(--ink2);display:flex;align-items:center;gap:4px}
.dur button{min-width:58px}
.dur button kbd,.mrow kbd{font-size:10px;color:var(--ink3);margin-left:3px;font-family:var(--sans)}
#inputStaff{display:block;width:100%;max-width:820px;height:auto;background:#FCFBF8;border:1px solid var(--line);border-radius:8px;cursor:crosshair}
#score{min-height:110px;border:1px solid var(--line);border-radius:8px;padding:4px;margin-top:8px;overflow-x:auto}
#score .abcjs-note.sel path,#score .abcjs-rest.sel path{fill:var(--sel)}
#score .playing path{fill:var(--teal)}
#mhint{font-size:12px;color:var(--ink3);line-height:1.7}
#mhint b{color:var(--ink2);font-weight:600}
</style>
</head>
<body class="mode-opera">

<div id="top">
  <div class="row">
    <input id="title" type="text" placeholder="劇名" value="">
    <div class="seg" id="modeSeg">
      <button data-mode="musical">音樂劇</button>
      <button data-mode="opera">戲曲</button>
    </div>
    <select id="genre" title="劇種">
      <option value="kunjing">京劇／崑曲（曲牌）</option>
      <option value="gezai">歌仔戲（曲調）</option>
      <option value="hakka">客家戲（曲調）</option>
      <option value="other">其他</option>
    </select>
    <label class="hide" style="font-size:12px;color:var(--ink2)">動作符號
      <select id="amark"><option value="tri">▲</option><option value="paren">（ ）</option><option value="none">不加</option></select>
    </label>
    <span class="spacer"></span>
    <span id="status"></span>
    <button id="btnNew">開新劇本</button>
    <button id="btnSamples">看範例 ▾</button>
    <button id="btnOpen" title="⌘O / Ctrl+O">開啟檔案</button>
    <button id="btnSave" title="⌘S / Ctrl+S">存成檔案</button>
    <button id="btnHelp">快捷鍵說明</button>
  </div>
  <div class="row" id="elRow"></div>
</div>

<div id="layout">
  <nav id="nav"><h3>導覽</h3><div id="navList"></div></nav>
  <main id="paper"><div id="editor"></div></main>
</div>

<input id="fileInput" type="file" accept=".json,application/json" class="hide">

<!-- 開新文件：選類型 -->
<div id="chooser" class="overlay hide">
  <div class="dialog">
    <h2>開新劇本</h2>
    <p>先選類型（寫到一半也可以切換，內容不會消失）</p>
    <div class="big">
      <button data-new="musical">音樂劇<small>歌名編號橫幅、歌詞楷體縮排</small></button>
      <button data-new="opera">戲曲<small>【曲牌／曲調】、歌詞縮排</small></button>
    </div>
    <p style="margin:18px 0 0"><button data-sample="musical">看音樂劇範例</button> <button data-sample="opera">看戲曲範例</button> <button id="btnCancelNew">取消</button></p>
  </div>
</div>

<!-- 快捷鍵說明 -->
<div id="help" class="overlay hide">
  <div class="dialog">
    <h2 style="margin:0;font-family:var(--serif)">快捷鍵說明</h2>
    <h3>寫劇本時</h3>
    <table id="helpTable"></table>
    <h3>五線譜視窗裡</h3>
    <table id="helpMusic"></table>
    <p style="text-align:right;margin:14px 0 0"><button data-close>關閉（Esc）</button></p>
  </div>
</div>

<!-- 曲調庫 -->
<div id="lib" class="overlay hide">
  <div class="dialog" tabindex="-1">
    <div class="mrow" style="margin-top:0"><h2 style="margin:0">📚 曲調庫</h2><span class="spacer"></span><button id="libClose">關閉 <kbd>Esc</kbd></button></div>
    <div class="seg" id="libTabs" style="margin:6px 0 2px"><button data-lib="">全部</button><button data-lib="gezai">歌仔戲曲調</button><button data-lib="hakka">客家曲調</button></div>
    <div style="font-size:12px;color:var(--ink3);line-height:1.6;margin-top:6px">只收錄經查證為<b>傳統曲調</b>（作者不可考），或<b>作曲者逝世已逾五十年、著作財產權已消滅</b>的曲調旋律；<b>不含任何歌詞</b>。旋律由公開曲譜重新轉錄。對收錄曲調有疑義，請告訴我們，查證後會立即移除。</div>
    <input id="libSearch" type="search" placeholder="搜尋曲名（例：七字、都馬、哭）">
    <label style="font-size:13px;color:var(--ink2)"><input type="checkbox" id="libIntro"> 包含前奏（沒勾＝從第一句唱詞開始）</label>
    <div id="libList" style="margin-top:8px"></div>
  </div>
</div>

<!-- 五線譜便利貼 -->
<div id="music" class="overlay hide">
  <div class="dialog" tabindex="-1">
    <div class="mrow" style="margin-top:0">
      <h2 id="mTitle">旋律</h2>
      <span class="spacer"></span>
      <label>開頭調號 <select id="mKey"></select></label>
      <label id="mModLabel" title="按 K 也可以">換調 <select id="mMod"></select></label>
      <label>拍號 <select id="mMeter"><option>4/4</option><option>3/4</option><option>2/4</option><option>6/8</option></select></label>
      <label><input type="checkbox" id="mJp"> 顯示簡譜數字</label>
      <label>速度 <input id="mTempo" type="number" min="30" max="240" step="5" style="width:64px"> 拍/分</label>
    </div>
    <div id="libSuggest" class="hide"></div>
    <div class="mrow dur" id="durRow"></div>
    <svg id="inputStaff" viewBox="0 0 820 170" aria-label="點五線譜放音符"></svg>
    <div id="score"></div>
    <div class="mrow">
      <button id="mPlay">▶ 播放 <kbd>空白鍵</kbd></button>
      <button id="mDel">刪除音符 <kbd id="delKey">⌫</kbd></button>
      <button id="mClear">全部清除</button>
      <button id="mLib">📚 曲調庫</button>
      <span class="spacer"></span>
      <button id="mDone" class="on">完成 <kbd>Esc</kbd></button>
    </div>
    <div id="mhint"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/abcjs@6.4.4/dist/abcjs-basic-min.js"></script>
<script src="tunes.js?v=20261003c"></script><!-- 改了曲調庫要換 v 值，瀏覽器才不會用舊檔 -->
<script type="module">
import { Editor, Node, Mark, Extension } from 'https://esm.sh/@tiptap/core@2.11.5';
import Document from 'https://esm.sh/@tiptap/extension-document@2.11.5';
import Text from 'https://esm.sh/@tiptap/extension-text@2.11.5';
import History from 'https://esm.sh/@tiptap/extension-history@2.11.5';
import { Plugin, PluginKey, TextSelection } from 'https://esm.sh/@tiptap/pm@2.11.5/state';
import { Decoration, DecorationSet } from 'https://esm.sh/@tiptap/pm@2.11.5/view';

const isMac = /Mac|iPhone|iPad/.test(navigator.platform);
const ALT = isMac ? '⌥' : 'Alt+';
const MOD = isMac ? '⌘' : 'Ctrl+';
const STORE_KEY = 'xiaoye-musical-opera-doc';
if (!isMac) document.getElementById('delKey').textContent = 'Backspace';

/* ───────── 元素定義 ───────── */
const KINDS = [
  { kind:'scene',  label:'場次', key:'1' },
  { kind:'action', label:'動作', key:'2' },
  { kind:'speech', label:'對白', key:'3' },
  { kind:'song',   label:'歌名', labelOpera:'曲牌', key:'4' },
  { kind:'singer', label:'唱者', key:'5' },
  { kind:'lyric',  label:'歌詞', key:'6' },
];
const NEXT = { scene:'action', action:'action', speech:'speech', song:'lyric', singer:'lyric', lyric:'lyric' };
const state = { mode:'opera', genre:'gezai', amark:'tri' };
const kindLabel = k => { const d = KINDS.find(x=>x.kind===k); return d ? (state.mode==='opera' && d.labelOpera ? d.labelOpera : d.label) : k; };

/* ───────── 旋律資料與 ABC 轉換 ───────── */
// 音符：{ s:音級（八度*7+音名，中央C=28）, acc:undefined|1|-1|0（升/降/還原）, d:長度（十六分音符為單位）, rest:true/false }
const LETTERS = 'CDEFGAB';
const BASE = [0,2,4,5,7,9,11];
const KEYS = { C:[0,0], G:[4,1], D:[1,2], A:[5,3], E:[2,4], F:[3,-1], Bb:[6,-2], Eb:[2,-3], Ab:[5,-4] };
const KEY_NAMES = { C:'C 大調', G:'G 大調', D:'D 大調', A:'A 大調', E:'E 大調', F:'F 大調', Bb:'降B 大調', Eb:'降E 大調', Ab:'降A 大調' };
const SHARP_ORDER = [3,0,4,1,5,2,6], FLAT_ORDER = [6,2,5,1,4,0,3];
const DURS = [ {d:16,name:'全音符',k:'Z'}, {d:8,name:'二分',k:'X'}, {d:4,name:'四分',k:'C'}, {d:2,name:'八分',k:'V'}, {d:1,name:'十六分',k:'B'} ];
const newMusic = () => ({ key:'C', meter:'4/4', tempo:90, notes:[] });
// 中途換調：音符帶 k:'F' 表示「從這個音開始換成 F 大調」
const keyAt = (m, i) => { let k = m.key; for (let j = 0; j <= i && j < m.notes.length; j++) if (m.notes[j].k) k = m.notes[j].k; return k; };
const KEY_JP = { C:'C', G:'G', D:'D', A:'A', E:'E', F:'F', Bb:'♭B', Eb:'♭E', Ab:'♭A' };
const keyAcc = (key, letter) => {
  const n = KEYS[key][1];
  if (n > 0 && SHARP_ORDER.slice(0,n).includes(letter)) return 1;
  if (n < 0 && FLAT_ORDER.slice(0,-n).includes(letter)) return -1;
  return 0;
};
const midiOf = (note, key) => {
  const oct = Math.floor(note.s/7), letter = ((note.s%7)+7)%7;
  const acc = note.acc === undefined || note.acc === null ? keyAcc(key, letter) : note.acc;
  return 12*(oct+1) + BASE[letter] + acc;
};
const jianpu = (s, key) => ((((s%7)+7)%7) - KEYS[key][0] + 7) % 7 + 1;
const barLen = meter => { const [a,b] = meter.split('/').map(Number); return a*16/b; };
const beatLen = meter => meter === '6/8' ? 6 : 4;
function abcPitch(s){
  const oct = Math.floor(s/7), L = LETTERS[((s%7)+7)%7];
  if (oct >= 5) return L.toLowerCase() + "'".repeat(oct-5);
  return L + ','.repeat(Math.max(0, 4-oct));
}
// 簡譜數字（含高低音點、升降）：中音區的 1 放在 C4～F4（C D E F 調）或 G3～B3（G A B 調）
const tonicS = key => { const L = KEYS[key][0]; return (L <= 3 ? 28 : 21) + L; };
function jpLabel(n, key){
  if (n.rest) return '0';
  const deg = jianpu(n.s, key), oct = Math.round((n.s - (tonicS(key) + deg - 1)) / 7);
  const letter = ((n.s % 7) + 7) % 7, base = keyAcc(key, letter);
  const eff = n.acc === undefined || n.acc === null ? base : n.acc;
  const pre = eff > base ? '♯' : eff < base ? '♭' : '';
  return pre + deg + (oct < 0 ? '\u0323'.repeat(-oct) : '\u0307'.repeat(oct));
}
let showJp = true;
try { showJp = localStorage.getItem('xiaoye-show-jianpu') !== '0'; } catch (e) {}
function toABC(m, title, jp = showJp){
  const head = `X:1\nT:${(title||'').replace(/\n/g,' ')}\nM:${m.meter}\nL:1/16\nQ:1/4=${m.tempo}\nK:${m.key}\n`;
  if (!m.notes.length) return head + 'x' + barLen(m.meter) + ' |]';
  let bl = barLen(m.meter), bt = beatLen(m.meter);
  let body = '', pos = 0, bars = 0, key = m.key, barAcc = {};
  m.notes.forEach((n, i) => {
    if (pos >= bl) { body += '| '; pos = 0; bars++; barAcc = {}; if (bars % 4 === 0) body += '\n'; }
    if (n.m) { body += `[M:${n.m}] `; bl = barLen(n.m); bt = beatLen(n.m); }   // 中途換拍號（曲調庫裡有些曲子會用到）
    if (n.k) { body += `[K:${n.k}] "^1=${KEY_JP[n.k]}" `; key = n.k; barAcc = {}; }
    // 簡譜的升降只管這一個音；五線譜（ABC）的臨時記號會延續到小節結束 → 同小節同音高後面的音要明確寫回來
    let acc = '';
    if (!n.rest) {
      const eff = n.acc === undefined || n.acc === null ? keyAcc(key, ((n.s%7)+7)%7) : n.acc;
      if ((n.acc !== undefined && n.acc !== null) || (n.s in barAcc && barAcc[n.s] !== eff)) {
        acc = eff === 1 ? '^' : eff === -1 ? '_' : '=';
        barAcc[n.s] = eff;
      }
    }
    // 長度以十六分音符為 1；三十二分音符（0.5）等非整數寫成 ABC 的分數（例 1/2、3/2）
    const len = n.d === 1 ? '' : Number.isInteger(n.d) ? n.d : `${Math.round(n.d*2)}/2`;
    if (jp) body += `"_${jpLabel(n, key)}"`;
    body += (n.rest ? 'z' : acc + abcPitch(n.s)) + len + (n.tie && !n.rest ? '-' : '');
    pos += n.d;
    const next = m.notes[i+1];
    const joinBeam = next && !next.k && !next.m && n.d < 4 && next.d < 4 && !n.rest && !next.rest && pos % bt !== 0 && pos < bl;
    if (!joinBeam) body += ' ';
  });
  return head + body + '|]';
}

/* ───────── 播放 ───────── */
let playing = null;
async function playMusic(m, renderTarget, onEnd){
  stopMusic();
  if (!window.ABCJS || !ABCJS.synth.supportsAudio()) { alert('這個瀏覽器不支援播放'); return; }
  if (!m.notes.length) return;
  const target = renderTarget || document.createElement('div');
  const vo = ABCJS.renderAbc(target, toABC(m), { add_classes:true })[0];
  const synth = new ABCJS.synth.CreateSynth();
  const me = { synth, timer:null, onEnd };
  playing = me;
  setStatus('載入音色中⋯');
  try {
    await synth.init({ visualObj: vo, options:{ program:0 } });
    await synth.prime();
  } catch (e) { setStatus('播放失敗：' + (e.message||e)); playing = null; return; }
  if (playing !== me) return;
  setStatus('');
  synth.start();
  if (renderTarget) {
    me.timer = new ABCJS.TimingCallbacks(vo, { qpm: m.tempo, eventCallback: ev => {
      renderTarget.querySelectorAll('.playing').forEach(el=>el.classList.remove('playing'));
      if (!ev) { finish(); return; }
      (ev.elements||[]).forEach(set => set.forEach(el => el.classList.add('playing')));
    }});
    me.timer.start();
  } else {
    const ms = m.notes.reduce((t,n)=>t+n.d,0) / 4 * 60000 / m.tempo;
    me.endTimer = setTimeout(finish, ms + 300);
  }
  function finish(){ if (playing === me) stopMusic(); }
}
function stopMusic(){
  if (!playing) return;
  const p = playing; playing = null;
  try { p.synth.stop(); } catch(e){}
  if (p.timer) p.timer.stop();
  clearTimeout(p.endTimer);
  document.querySelectorAll('.playing').forEach(el=>el.classList.remove('playing'));
  if (p.onEnd) p.onEnd();
}
function previewNote(note, key){
  if (!window.ABCJS || note.rest) return;
  try { ABCJS.synth.playEvent([{ pitch: midiOf(note,key), volume:85, start:0, duration:0.35, instrument:0 }], [], 1000); } catch(e){}
}

/* ───────── 編輯器：一行一個元素 ───────── */
const Line = Node.create({
  name:'line', group:'block', content:'inline*', defining:true,
  addAttributes(){ return {
    kind:{ default:'action', parseHTML:el=>el.getAttribute('data-kind')||'action', renderHTML:a=>({'data-kind':a.kind}) },
    reprise:{ default:false, keepOnSplit:false, parseHTML:el=>el.getAttribute('data-reprise')==='1', renderHTML:a=>a.reprise?{'data-reprise':'1'}:{} },
    fold:{ default:false, keepOnSplit:false, parseHTML:el=>el.getAttribute('data-fold')==='1', renderHTML:a=>a.fold?{'data-fold':'1'}:{} },
    music:{ default:null, keepOnSplit:false, parseHTML:el=>{ try{ return JSON.parse(el.getAttribute('data-music')) }catch(e){ return null } }, renderHTML:a=>a.music?{'data-music':JSON.stringify(a.music)}:{} },
  }; },
  parseHTML(){ return [{ tag:'p' }]; },
  renderHTML({ HTMLAttributes }){ return ['p', HTMLAttributes, 0]; },
  addNodeView(){
    return ({ node, getPos, editor }) => {
      const dom = document.createElement('div');
      dom.className = 'ln';
      dom.dataset.kind = node.attrs.kind;
      dom.dataset.label = kindLabel(node.attrs.kind);
      if (node.attrs.reprise) dom.dataset.reprise = '1';
      const content = document.createElement('p');
      content.className = 'ln-text';
      dom.append(content);
      let extra = [];
      if (node.attrs.kind === 'song') {
        const m = node.attrs.music, has = m && m.notes && m.notes.length;
        const tools = document.createElement('span');
        tools.className = 'song-tools'; tools.contentEditable = 'false';
        const edit = document.createElement('button');
        edit.textContent = has ? `🎼 旋律（${m.notes.length} 音）` : '🎼 加旋律';
        if (has) edit.className = 'has';
        edit.title = `打開五線譜（${ALT}M）`;
        edit.onmousedown = e => e.preventDefault();
        edit.onclick = () => openMusic(getPos());
        tools.append(edit);
        const del = document.createElement('button');
        del.textContent = '🗑'; del.title = '刪除這個' + (state.mode === 'opera' ? '曲牌' : '歌名') + '（名稱和旋律一起刪，底下的歌詞保留）';
        del.onmousedown = e => e.preventDefault();
        del.onclick = () => {
          const name = node.textContent || '未命名';
          if (!confirm(`刪除【${name}】${node.attrs.music ? '和它的旋律' : ''}？\n（底下的歌詞會保留；按 ⌘Z／Ctrl+Z 可以復原）`)) return;
          stopMusic();
          const pos = getPos(), st = editor.state;
          const tr = st.doc.childCount > 1 ? st.tr.delete(pos, pos + node.nodeSize)
            : st.tr.replaceWith(pos, pos + node.nodeSize, st.schema.nodes.line.create({ kind:'action' }));
          editor.view.dispatch(tr); editor.commands.focus();
        };
        if (has) {
          const play = document.createElement('button');
          play.textContent = '▶ 試聽';
          play.onmousedown = e => e.preventDefault();
          play.onclick = () => {
            if (playing) { stopMusic(); return; }
            play.textContent = '■ 停止';
            playMusic(m, preview, () => { play.textContent = '▶ 試聽'; });
          };
          tools.append(play);
          const fold = document.createElement('button');
          fold.textContent = node.attrs.fold ? '▸ 展開樂譜' : '▾ 收合樂譜';
          fold.title = node.attrs.fold ? '把樂譜顯示出來' : '把樂譜收起來，只留歌名';
          fold.onmousedown = e => e.preventDefault();
          fold.onclick = () => { stopMusic(); const pos = getPos(); editor.view.dispatch(editor.state.tr.setNodeAttribute(pos, 'fold', !node.attrs.fold)); };
          tools.append(fold);
        }
        tools.append(del);   // 刪除放最右邊，避免誤按
        dom.append(tools); extra.push(tools);
        let preview = null;
        if (has && !node.attrs.fold) {
          preview = document.createElement('div');
          preview.className = 'song-preview'; preview.contentEditable = 'false';
          preview.title = '點一下編輯旋律';
          preview.onclick = () => openMusic(getPos());
          dom.append(preview); extra.push(preview);
          preview._music = m;
          requestAnimationFrame(() => drawPreview(preview));
        }
      }
      return {
        dom, contentDOM: content,
        update(n){
          if (n.type !== node.type || n.attrs.kind !== node.attrs.kind || n.attrs.reprise !== node.attrs.reprise || n.attrs.fold !== node.attrs.fold || n.attrs.music !== node.attrs.music) return false;
          node = n; return true;
        },
        stopEvent: e => extra.some(x => x.contains(e.target)),
        ignoreMutation: m => extra.some(x => x.contains(m.target)) || m.target === dom && m.type === 'attributes',
      };
    };
  },
});

function drawPreview(el){ ABCJS.renderAbc(el, toABC(el._music), { add_classes:true, staffwidth:520, scale:0.75, paddingtop:0, paddingbottom:0, responsive:'resize' }); }
function rerenderPreviews(){ document.querySelectorAll('.song-preview').forEach(el => { if (el._music) drawPreview(el); }); }

const Note = Mark.create({
  name:'note',
  parseHTML(){ return [{ tag:'span.note' }]; },
  renderHTML(){ return ['span', { class:'note' }, 0]; },
});

const curKey = new PluginKey('cur');
const Deco = Extension.create({
  name:'deco',
  addProseMirrorPlugins(){
    return [new Plugin({ key:curKey, props:{ decorations(st){
      const decos = [];
      const { $from } = st.selection;
      const curStart = $from.depth >= 1 ? $from.before(1) : -1;
      st.doc.forEach((node, pos) => {
        const cls = [];
        if (pos === curStart) cls.push('cur');
        if (node.content.size === 0) cls.push('is-empty');
        if (cls.length) decos.push(Decoration.node(pos, pos + node.nodeSize, { class: cls.join(' ') }));
        const k = node.attrs.kind;
        if (k === 'speech' || k === 'lyric') {
          const t = node.textContent, i = t.search(/[：:]/);
          if (i > 0 && i <= 16) decos.push(Decoration.inline(pos+1, pos+2+i, { class:'who' }));
        }
      });
      return DecorationSet.create(st.doc, decos);
    }}})];
  },
});

function setKind(kind){
  const ed = editor, { $from } = ed.state.selection;
  if ($from.depth < 1) return true;
  const pos = $from.before(1), node = ed.state.doc.nodeAt(pos);
  if (!node || node.attrs.kind === kind) return true;
  ed.view.dispatch(ed.state.tr.setNodeMarkup(pos, null, { ...node.attrs, kind, reprise: kind==='song' ? node.attrs.reprise : false }));
  return true;
}
function currentLine(){
  const { $from } = editor.state.selection;
  if ($from.depth < 1) return null;
  const pos = $from.before(1);
  return { pos, node: editor.state.doc.nodeAt(pos) };
}
// 續（重複段）：插入「續【上一段歌名／曲牌】」，上一段有旋律就複製一份過來（之後各改各的）
function prevSong(before){
  let found = null;
  editor.state.doc.forEach((n, pos) => { if (pos < before && n.attrs.kind === 'song' && n.content.size) found = n; });
  return found;
}
const copyMusic = m => m ? JSON.parse(JSON.stringify(m)) : null;
function insertReprise(){
  const c = currentLine(); if (!c) return true;
  const { schema } = editor.state;
  // 游標在已經寫好名字的歌名行：切換「續」（切成續時，若還沒旋律就沿用上一段同名的）
  if (c.node.attrs.kind === 'song' && c.node.content.size) {
    const on = !c.node.attrs.reprise;
    let music = c.node.attrs.music;
    if (on && !music) {
      let same = null;
      editor.state.doc.forEach((n, pos) => { if (pos < c.pos && n.attrs.kind === 'song' && n.textContent === c.node.textContent && n.attrs.music) same = n; });
      if (same) music = copyMusic(same.attrs.music);
    }
    editor.view.dispatch(editor.state.tr.setNodeMarkup(c.pos, null, { ...c.node.attrs, reprise: on, music }));
    return true;
  }
  const src = prevSong(c.pos);
  if (!src) { alert('前面還沒有歌名／曲牌，沒有東西可以「續」。\n請先寫一段歌名／曲牌。'); return true; }
  const song = schema.nodes.line.create({ kind:'song', reprise:true, music: copyMusic(src.attrs.music), fold: src.attrs.fold }, src.content);
  const lyric = schema.nodes.line.create({ kind:'lyric' });
  const empty = c.node.content.size === 0;
  const at = empty ? c.pos : c.pos + c.node.nodeSize;
  const tr = editor.state.tr;
  if (empty) tr.replaceWith(c.pos, c.pos + c.node.nodeSize, [song, lyric]);
  else tr.insert(at, [song, lyric]);
  tr.setSelection(TextSelection.create(tr.doc, at + song.nodeSize + 1)).scrollIntoView();
  editor.view.dispatch(tr);
  return true;
}
function songForCursor(){
  const c = currentLine(); if (!c) return null;
  let found = null;
  editor.state.doc.forEach((node, pos) => { if (pos <= c.pos && node.attrs.kind === 'song') found = pos; });
  return found;
}

const Keys = Extension.create({
  name:'keys', priority:1000,
  addKeyboardShortcuts(){
    const map = {
      'Enter': () => {
        const c = currentLine(); if (!c) return false;
        const k = c.node.attrs.kind;
        if (c.node.content.size === 0 && k !== 'action') return setKind('action');
        const next = NEXT[k] || 'action';
        return this.editor.chain().splitBlock().command(({ tr, state }) => {
          const $f = tr.selection.$from, p = $f.before(1), n = tr.doc.nodeAt(p);
          tr.setNodeMarkup(p, null, { ...n.attrs, kind: next, reprise:false, music:null });
          return true;
        }).run();
      },
      'Tab': () => {
        const c = currentLine(); if (!c) return true;
        const t = c.node.textContent;
        if ((c.node.attrs.kind === 'speech' || c.node.attrs.kind === 'lyric') && t.length && !/[：:]/.test(t)) {
          editor.chain().command(({ tr }) => { tr.insertText('：', c.pos + 1 + t.length); tr.setSelection(TextSelection.create(tr.doc, c.pos + 2 + t.length)); return true; }).run();
          return true;
        }
        const i = KINDS.findIndex(x => x.kind === c.node.attrs.kind);
        return setKind(KINDS[(i+1) % KINDS.length].kind);
      },
      'Shift-Tab': () => {
        const c = currentLine(); if (!c) return true;
        const i = KINDS.findIndex(x => x.kind === c.node.attrs.kind);
        return setKind(KINDS[(i - 1 + KINDS.length) % KINDS.length].kind);
      },
      'Alt-7': () => {
        this.editor.chain().insertContent({ type:'text', text:'（）', marks:[{ type:'note' }] }).command(({ tr }) => {
          tr.setSelection(TextSelection.create(tr.doc, tr.selection.from - 1)); return true;
        }).run();
        return true;
      },
      'Alt-r': () => insertReprise(),
      'Alt-m': () => {
        let p = songForCursor();
        if (p === null) { alert('請先把游標放在歌名／曲牌行（或它底下的歌詞）'); return true; }
        openMusic(p); return true;
      },
    };
    KINDS.forEach(d => { map['Alt-' + d.key] = () => setKind(d.kind); });
    return map;
  },
});

const editor = new Editor({

const elRow = document.getElementById('elRow');
function buildToolbar(){

/* 動作按鈕長按（或按右鍵）：選動作指示前面要不要加符號 */
const AMARKS = [ ['tri','▲ 三角形'], ['paren','（ ）括號'], ['none','不加符號'] ];
function attachAmarkMenu(b){
  b.classList.add('has-menu');
  b.title = '長按或按右鍵：選動作指示的符號';
  let timer;
  const open = () => { b._longPressed = true; showAmarkMenu(b); };
  b.addEventListener('pointerdown', e => { if (e.button !== 0) return; b._longPressed = false; timer = setTimeout(open, 450); });
  ['pointerup','pointerleave','pointercancel'].forEach(t => b.addEventListener(t, () => clearTimeout(timer)));
  b.addEventListener('contextmenu', e => { e.preventDefault(); clearTimeout(timer); showAmarkMenu(b); });
}
function closeAmarkMenu(){ const m = document.getElementById('amarkMenu'); if (m) m.remove(); }
// 小選單（動作符號、看範例共用）：items = [[值, 文字, 是否打勾]]
function popMenu(b, title, items, onPick){
  closeAmarkMenu();
  const m = document.createElement('div'); m.id = 'amarkMenu';
  m.innerHTML = `<div class="t">${title}</div>` +
    items.map(([v, t, on]) => `<button data-v="${v}"><span class="ck">${on ? '✓' : ''}</span>${t}</button>`).join('');
  m.addEventListener('mousedown', e => e.preventDefault());
  m.querySelectorAll('button').forEach(o => o.onclick = () => { closeAmarkMenu(); onPick(o.dataset.v); });
  document.body.append(m);
  const r = b.getBoundingClientRect();
  m.style.left = Math.max(8, Math.min(r.left, innerWidth - m.offsetWidth - 8)) + 'px';
  m.style.top = (r.bottom + 4) + 'px';
}
function showAmarkMenu(b){
  popMenu(b, '動作指示前面加什麼（整份劇本）', AMARKS.map(([v, t]) => [v, t, state.amark === v]), v => {
    state.amark = v; applyMode(); scheduleSave(); editor.commands.focus();
  });
}
document.addEventListener('pointerdown', e => { const m = document.getElementById('amarkMenu'); if (m && !m.contains(e.target)) closeAmarkMenu(); }, true);
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeAmarkMenu(); });
function runShortcut(name){
  const ext = editor.extensionManager.extensions.find(e => e.name === 'keys');

}

let navTimer;
function scheduleNav(){ clearTimeout(navTimer); navTimer = setTimeout(buildNav, 250); }
function buildNav(){
  const list = document.getElementById('navList'); list.innerHTML = '';
  let songs = 0, melodies = 0, num = 0;
  editor.state.doc.forEach((node, pos) => {
    const k = node.attrs.kind;
    if (k !== 'scene' && k !== 'song') return;
    const a = document.createElement('a');
    a.className = k;
    let t = node.textContent || (k === 'scene' ? '（未命名場次）' : '（未命名）');
    if (k === 'song') {
      if (!node.attrs.reprise) { songs++; num++; }
      if (node.attrs.music && node.attrs.music.notes.length) melodies++;
      const prefix = state.mode === 'musical' ? (node.attrs.reprise ? '# 續' : '#' + String(num).padStart(2,'0') + ' ') : (node.attrs.reprise ? '續' : '');
      t = prefix + '【' + t + '】' + (node.attrs.music && node.attrs.music.notes.length ? ' ♪' : '');
    }
    a.textContent = t;
    a.onclick = () => {
      editor.chain().focus().setTextSelection(pos + 1).run();
      const dom = editor.view.nodeDOM(pos);

  });

let saveTimer;
function setStatus(t){ document.getElementById('status').textContent = t; }
function snapshot(){
  return { app:'xiaoye-musical-opera', version:1, title: document.getElementById('title').value, mode: state.mode, genre: state.genre, amark: state.amark, doc: editor.getJSON(), savedAt: new Date().toISOString() };
}
function scheduleSave(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(snapshot())); setStatus('已自動暫存在這台電腦 ' + new Date().toLocaleTimeString('zh-TW', { hour:'2-digit', minute:'2-digit' })); }
    catch (e) { setStatus('⚠ 無法自動暫存，記得按「存成檔案」'); }
  }, 600);
}
function load(data){
  if (!data || !data.doc) return false;
  document.getElementById('title').value = data.title || '';
  state.mode = data.mode === 'musical' ? 'musical' : 'opera';
  state.genre = data.genre || 'gezai';
  state.amark = data.amark || 'tri';
  editor.commands.setContent(data.doc);
  applyMode(); buildNav();
  return true;
}
function saveFile(){
  const data = snapshot();
  const name = (data.title || '未命名劇本').replace(/[\\/:*?"<>|]/g, '_');
  const d = new Date(), stamp = `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}`;
  const blob = new Blob([JSON.stringify(data, null, 1)], { type:'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = `${name}_${stamp}.json`;
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  setStatus('已存成檔案（在「下載」資料夾）');
}
document.getElementById('btnSave').onclick = saveFile;
document.getElementById('btnOpen').onclick = () => document.getElementById('fileInput').click();
document.getElementById('fileInput').onchange = async e => {
  const f = e.target.files[0]; e.target.value = '';
  if (!f) return;
  try {
    const data = JSON.parse(await f.text());
    if (data.app !== 'xiaoye-musical-opera') throw new Error('不是這個工坊存的檔案');
    load(data); scheduleSave(); setStatus('已開啟：' + f.name);
  } catch (err) { alert('開不起來：' + err.message); }
};
document.addEventListener('keydown', e => {
  if (!document.getElementById('music').classList.contains('hide')) return;

  if ((e.metaKey || e.ctrlKey) && !e.altKey && e.key.toLowerCase() === 'o') { e.preventDefault(); document.getElementById('fileInput').click(); }

});

{

  const rep = lines.find(l => l.attrs.kind === 'song' && l.attrs.reprise);

function openMusic(pos){
  const node = editor.state.doc.nodeAt(pos);
  if (!node || node.attrs.kind !== 'song') return;
  stopMusic();
  M.pos = pos;
  M.m = JSON.parse(JSON.stringify(node.attrs.music || newMusic()));
  M.sel = -1; M.cursor = M.m.notes.length; M.dot = false; M.pendingKey = null;
  document.getElementById('mTitle').textContent = (node.attrs.reprise ? '續' : '') + '【' + (node.textContent || '未命名') + '】旋律';
  keySel.value = M.m.key; document.getElementById('mMeter').value = M.m.meter; document.getElementById('mTempo').value = M.m.tempo;
  mEl.classList.remove('hide');
  drawInputStaff(); renderScore(); refreshDurButtons(); refreshMod(); refreshSuggest();
  mEl.querySelector('.dialog').focus();
}
function commitMusic(){
  const node = editor.state.doc.nodeAt(M.pos);
  if (!node) return;
  const music = M.m.notes.length ? JSON.parse(JSON.stringify(M.m)) : null;
  editor.view.dispatch(editor.state.tr.setNodeMarkup(M.pos, null, { ...node.attrs, music }));
}
function closeMusic(){
  stopMusic(); commitMusic();
  mEl.classList.add('hide');
  editor.commands.focus();
  buildNav();
}

function changed(){ renderScore(); commitMusic(); refreshMod(); drawInputStaff(); }
function setDur(d){
  M.dur = d;
  const t = target();
  if (M.sel >= 0 && t >= 0) { M.m.notes[t].d = M.dot ? d * 1.5 : d; changed(); }
  else M.dot = false;
  refreshDurButtons();
}
// 附點：像寫簡譜「5.」一樣，加在剛輸入（或選取）的那個音上；再按一次取消
function toggleDot(){
  const t = target(); if (t < 0) return;
  const n = M.m.notes[t];
  const dotted = [24,12,6,3].includes(n.d);
  const base = dotted ? n.d / 1.5 : n.d;
  if (base === 1) return; // 十六分音符不加附點
  n.d = dotted ? base : base * 1.5;
  if (M.sel >= 0) { M.dot = !dotted; refreshDurButtons(); }
  changed();
}
function refreshDurButtons(){
  durRow.querySelectorAll('[data-d]').forEach(b => b.classList.toggle('on', +b.dataset.d === M.dur));
  durRow.querySelector('[data-dot]').classList.toggle('on', M.dot);
}
function target(){ return M.sel >= 0 ? M.sel : M.cursor - 1; }
// 輸入點的調：選取中＝那個音的調；在結尾輸入＝最後一個音的調（或等著套用的新調）
function inKey(){ return M.sel >= 0 ? keyAt(M.m, M.sel) : (M.pendingKey || keyAt(M.m, M.cursor - 1)); }
function refreshMod(){
  const label = document.getElementById('mModLabel');
  if (M.sel >= 0) { label.firstChild.textContent = '從選取的音換調 '; modSel.value = M.m.notes[M.sel].k || ''; }
  else { label.firstChild.textContent = '從下一個音換調 '; modSel.value = M.pendingKey || ''; }
}
// 簡譜數字不變、實際音高跟著移（像簡譜寫「1＝F」）
function retune(from, oldKey, newKey){
  let shift = KEYS[newKey][0] - KEYS[oldKey][0];
  if (shift > 3) shift -= 7; if (shift < -3) shift += 7;
  if (!shift) return;
  for (let i = from; i < M.m.notes.length; i++) {
    if (i > from && M.m.notes[i].k) break;
    if (!M.m.notes[i].rest) M.m.notes[i].s += shift;
  }
}
modSel.onchange = () => {
  const v = modSel.value;
  if (M.sel >= 0) {
    const n = M.m.notes[M.sel];
    const before = keyAt(M.m, M.sel);
    if (v) n.k = v; else delete n.k;
    retune(M.sel, before, keyAt(M.m, M.sel));
    previewNote(n, keyAt(M.m, M.sel));
    changed();
  } else {
    M.pendingKey = v || null;
    drawInputStaff();
  }
  mEl.querySelector('.dialog').focus();
};
function refStep(){
  const t = target();
  for (let i = t; i >= 0; i--) if (!M.m.notes[i].rest) return M.m.notes[i].s;
  return tonicS(inKey());
}
function addNote(n){
  const note = { d: M.dur, ...n };
  M.dot = false; refreshDurButtons();
  const at = M.sel >= 0 ? M.sel + 1 : M.cursor;
  if (M.sel < 0 && M.pendingKey) { if (M.pendingKey !== keyAt(M.m, at - 1)) note.k = M.pendingKey; M.pendingKey = null; }
  M.m.notes.splice(at, 0, note);
  M.sel = -1; M.cursor = at + 1;
  previewNote(note, keyAt(M.m, at));
  changed();
}
function addJianpu(num){
  const letter = (KEYS[inKey()][0] + num - 1) % 7;
  const ref = refStep();
  let best = null;
  for (let o = 2; o <= 6; o++) { const s = o*7 + letter; if (best === null || Math.abs(s - ref) < Math.abs(best - ref)) best = s; }
  addNote({ s: best });
}
function moveStep(delta){
  const t = target(); if (t < 0) return;
  const n = M.m.notes[t]; if (n.rest) return;
  n.s = Math.max(14, Math.min(49, n.s + delta)); delete n.acc;
  previewNote(n, keyAt(M.m, t)); changed();
}
function cycleAcc(dir){
  const t = target(); if (t < 0) return;
  const n = M.m.notes[t]; if (n.rest) return;
  n.acc = n.acc === dir ? 0 : n.acc === 0 ? undefined : dir;
  if (n.acc === undefined) delete n.acc;
  previewNote(n, keyAt(M.m, t)); changed();
}
function delNote(){
  const t = target(); if (t < 0) return;
  M.m.notes.splice(t, 1);
  if (M.sel >= 0) { M.sel = Math.min(M.sel, M.m.notes.length - 1); if (M.sel < 0) M.cursor = 0; }
  else M.cursor = Math.max(0, M.cursor - 1);
  changed();
}
function select(i){
  if (i < 0 || i >= M.m.notes.length) return;
  M.sel = i;
  const n = M.m.notes[i];
  M.dot = n.d !== 1 && [24,12,6,3].includes(n.d);
  M.dur = M.dot ? n.d / 1.5 : n.d;
  if (!DURS.some(x => x.d === M.dur)) { M.dur = 4; M.dot = false; }
  refreshDurButtons(); highlightSel(); refreshMod(); drawInputStaff();
  previewNote(n, keyAt(M.m, i));
}
function togglePlay(){
  const btn = document.getElementById('mPlay');
  if (playing) { stopMusic(); return; }
  if (!M.m.notes.length) return;
  btn.firstChild.textContent = '■ 停止 ';
  playMusic(M.m, document.getElementById('score'), () => { btn.firstChild.textContent = '▶ 播放 '; renderScore(); });
}
function renderScore(){
  const vo = ABCJS.renderAbc('score', toABC(M.m), {
    add_classes:true, responsive:'resize', clickListener: (abcelem) => {
      const i = M.noteEls.indexOf(abcelem);
      if (i >= 0) select(i);
    },
  })[0];
  M.noteEls = [];
  if (M.m.notes.length) vo.lines.forEach(l => (l.staff||[]).forEach(st => st.voices.forEach(v => v.forEach(el => { if (el.el_type === 'note') M.noteEls.push(el); }))));
  highlightSel();
  // 播放鍵狀態
  document.getElementById('mPlay').disabled = !M.m.notes.length;
}
function highlightSel(){
  document.querySelectorAll('#score .sel').forEach(el => el.classList.remove('sel'));
  const el = M.noteEls[M.sel];
  if (el && el.abselem) el.abselem.elemset.forEach(x => x.classList.add('sel'));
}

// 用來點選放音的五線譜（高音譜號，下加兩線到上加兩線）
const SVGNS = 'http://www.w3.org/2000/svg';
const STAFF = { top:40, gap:12, left:70, right:800, sE4:30 };
const yOf = s => STAFF.top + 4*STAFF.gap - (s - STAFF.sE4) * STAFF.gap/2;
const sOf = y => Math.round((STAFF.top + 4*STAFF.gap - y) / (STAFF.gap/2)) + STAFF.sE4;
function drawInputStaff(){
  const svg = document.getElementById('inputStaff');
  svg.innerHTML = '';
  const mk = (tag, attrs, text) => { const e = document.createElementNS(SVGNS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (text) e.textContent = text; svg.append(e); return e; };
  for (let i = 0; i < 5; i++) mk('line', { x1:20, x2:STAFF.right, y1:STAFF.top + i*STAFF.gap, y2:STAFF.top + i*STAFF.gap, stroke:'#555', 'stroke-width':1 });
  mk('text', { x:22, y:STAFF.top + 4*STAFF.gap + 12, 'font-size':68, fill:'#444' }, '𝄞');
  // 調號
  const n = KEYS[inKey()][1];
  const sharpS = [38,35,39,36,33,37,34], flatS = [34,37,33,36,32,35,31];
  for (let i = 0; i < Math.abs(n); i++) {
    const s = n > 0 ? sharpS[i] : flatS[i];
    mk('text', { x:62 + i*11, y:yOf(s) + 5, 'font-size':18, fill:'#444' }, n > 0 ? '♯' : '♭');
  }
  mk('text', { x:STAFF.right, y:160, 'font-size':12, fill:'#999', 'text-anchor':'end' }, '在這裡點一下放音符（目前長度：見上方按鈕）');
  const ghost = mk('g', { opacity:0 });
  const ledgers = document.createElementNS(SVGNS, 'g'); ghost.append(ledgers);
  const head = document.createElementNS(SVGNS, 'ellipse'); head.setAttribute('rx', 8); head.setAttribute('ry', 6); head.setAttribute('fill', '#8A3B2E'); ghost.append(head);
  const label = document.createElementNS(SVGNS, 'text'); label.setAttribute('font-size', 13); label.setAttribute('fill', '#8A3B2E'); ghost.append(label);
  const point = e => { const r = svg.getBoundingClientRect(); return { x:(e.clientX - r.left) * 820 / r.width, y:(e.clientY - r.top) * 170 / r.height }; };
  svg.onmousemove = e => {
    const p = point(e); const s = Math.max(25, Math.min(42, sOf(p.y)));
    const x = Math.max(150, Math.min(STAFF.right - 20, p.x));
    ghost.setAttribute('opacity', .75);
    head.setAttribute('cx', x); head.setAttribute('cy', yOf(s));
    label.setAttribute('x', x + 14); label.setAttribute('y', yOf(s) + 5);
    label.textContent = LETTERS[s % 7] + (Math.floor(s/7)) + '（簡譜 ' + jianpu(s, inKey()) + '）';
    ledgers.innerHTML = '';
    const lines = [];
    for (let t = 28; t >= s; t -= 2) lines.push(t);           // 下加線：C4、A3
    for (let t = 40; t <= s; t += 2) lines.push(t);           // 上加線：A5、C6
    lines.forEach(t => { const l = document.createElementNS(SVGNS, 'line'); l.setAttribute('x1', x-13); l.setAttribute('x2', x+13); l.setAttribute('y1', yOf(t)); l.setAttribute('y2', yOf(t)); l.setAttribute('stroke', '#8A3B2E'); ledgers.append(l); });
  };
  svg.onmouseleave = () => ghost.setAttribute('opacity', 0);
  svg.onclick = e => { const s = Math.max(25, Math.min(42, sOf(point(e).y))); addNote({ s }); };
}

/* ───────── 曲調庫 ───────── */
const TUNES = window.TUNES || [];
const libEl = document.getElementById('lib');
const tuneMatches = (t, q) => [t.name, ...(t.aliases||[])].some(n => n.includes(q));
const findTune = name => { const q = (name||'').trim(); return q ? TUNES.find(t => t.name === q || (t.aliases||[]).includes(q)) : null; };
// 從曲調庫取出一份旋律（不含前奏時，從第一句唱詞那一小節開始，調號接續當時的調）
function tuneMusic(t, withIntro){
  const m = JSON.parse(JSON.stringify(t.music));
  if (!withIntro && t.sungFrom > 0) {
    const startKey = keyAt(m, t.sungFrom - 1);
    m.notes = m.notes.slice(t.sungFrom);
    if (m.notes[0] && m.notes[0].k) { m.key = m.notes[0].k; delete m.notes[0].k; } else m.key = startKey;
  }
  return m;
}
function applyTune(t){
  if (M.m.notes.length && !confirm(`用【${t.name}】的旋律取代目前這首的 ${M.m.notes.length} 個音？`)) return false;
  stopMusic();
  M.m = tuneMusic(t, document.getElementById('libIntro').checked);
  M.sel = -1; M.cursor = M.m.notes.length; M.pendingKey = null;
  keySel.value = M.m.key; document.getElementById('mMeter').value = M.m.meter; document.getElementById('mTempo').value = M.m.tempo;
  changed();
  // 曲牌名：空白就自動填上；已有別的名字就問要不要換（以免選完忘了是哪一首）
  const node = editor.state.doc.nodeAt(M.pos);
  const cur = node.textContent.trim();
  const same = cur === t.name || (t.aliases||[]).includes(cur);
  if (!cur || (!same && confirm(`曲牌名要一起改成【${t.name}】嗎？\n（按「取消」保留原本的「${cur}」）`))) {
    const tr = editor.state.tr.replaceWith(M.pos + 1, M.pos + 1 + node.content.size, editor.state.schema.text(t.name));
    editor.view.dispatch(tr);
    document.getElementById('mTitle').textContent = (node.attrs.reprise ? '續' : '') + '【' + t.name + '】旋律';
    buildNav();
  }
  refreshSuggest();
  return true;
}
function buildLib(){
  const q = document.getElementById('libSearch').value.trim();
  const list = document.getElementById('libList');
  const items = TUNES.filter(t => (!libTab || t.lib === libTab) && (!q || tuneMatches(t, q)));
  list.innerHTML = items.length ? '' : `<div class="empty">${TUNES.length ? '找不到符合的曲調' : '曲調庫還沒有資料'}</div>`;
  items.forEach(t => {
    const row = document.createElement('div'); row.className = 'it';
    const bars = Math.round(t.music.notes.reduce((a,n)=>a+n.d,0) / barLen(t.music.meter));
    const LIBNAME = { gezai:'歌仔戲', hakka:'客家' };
    row.innerHTML = `<span class="nm">${t.name}${!libTab ? `<span class="meta">${LIBNAME[t.lib]||''}</span>` : ''}${t.version ? `<span class="meta">${t.version}</span>` : ''}${(t.aliases||[]).length ? `<span class="meta">又名 ${t.aliases.join('、')}</span>` : ''}<span class="meta">${t.music.meter}・${bars} 小節</span></span>`;
    const play = document.createElement('button'); play.textContent = '▶ 試聽';
    play.onclick = () => {
      if (playing) { const was = play.textContent; stopMusic(); if (was === '■ 停止') return; }
      document.querySelectorAll('#libList button.pl').forEach(b => b.textContent = '▶ 試聽');
      play.textContent = '■ 停止';
      playMusic(tuneMusic(t, document.getElementById('libIntro').checked), null, () => { play.textContent = '▶ 試聽'; });
    };
    play.className = 'pl';
    const use = document.createElement('button'); use.textContent = '放進這首'; use.className = 'on';
    use.onclick = () => { if (applyTune(t)) closeLib(); };
    row.append(play, use); list.append(row);
  });
}
let libTab = '';
document.querySelectorAll('#libTabs button').forEach(b => b.onclick = () => {
  libTab = b.dataset.lib;
  document.querySelectorAll('#libTabs button').forEach(x => x.classList.toggle('on', x === b));
  buildLib(); document.getElementById('libSearch').focus();
});
document.querySelector('#libTabs button').classList.add('on');
function openLib(){
  const name = editor.state.doc.nodeAt(M.pos)?.textContent || '';
  document.getElementById('libSearch').value = findTune(name) ? name : '';
  libEl.classList.remove('hide'); buildLib();
  document.getElementById('libSearch').focus();
}
function closeLib(){ stopMusic(); libEl.classList.add('hide'); mEl.querySelector('.dialog').focus(); }
document.getElementById('mLib').onclick = openLib;
document.getElementById('libClose').onclick = closeLib;
document.getElementById('libSearch').oninput = buildLib;
libEl.addEventListener('mousedown', e => { if (e.target === libEl) closeLib(); });
libEl.addEventListener('keydown', e => { if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); closeLib(); } });
// 曲牌名稱跟曲調庫一樣、而且還沒寫旋律 → 旋律視窗上方提示一鍵放入
function refreshSuggest(){
  const box = document.getElementById('libSuggest');
  const node = M.pos !== null ? editor.state.doc.nodeAt(M.pos) : null;
  const t = node && !M.m.notes.length ? findTune(node.textContent) : null;
  box.classList.toggle('hide', !t);
  if (!t) return;
  box.innerHTML = `曲調庫裡有【${t.name}】的傳統旋律 <button>放進來（從第一句唱詞開始）</button><button data-intro>含前奏</button>`;
  box.querySelector('button').onclick = () => { document.getElementById('libIntro').checked = false; applyTune(t); };
  box.querySelector('[data-intro]').onclick = () => { document.getElementById('libIntro').checked = true; applyTune(t); };
}

mEl.addEventListener('keydown', e => {
  if (mEl.classList.contains('hide')) return;
  if (!libEl.classList.contains('hide')) return;
  const tag = e.target.tagName;
  if (tag === 'INPUT' || tag === 'SELECT') { if (e.key === 'Escape') { e.target.blur(); mEl.querySelector('.dialog').focus(); } return; }
  const k = e.key;
  let done = true;
  if (k === 'Escape') closeMusic();
  else if (/^[1-7]$/.test(k)) addJianpu(+k);
  else if (k === '0') addNote({ rest:true });
  else if (/^[zxcvb]$/i.test(k) && !e.metaKey && !e.ctrlKey) setDur(DURS['zxcvb'.indexOf(k.toLowerCase())].d);
  else if (k === '.') toggleDot();
  else if (k === 'ArrowUp') moveStep(e.shiftKey ? 7 : 1);
  else if (k === 'ArrowDown') moveStep(e.shiftKey ? -7 : -1);
  else if (k === 'ArrowLeft') { if (M.m.notes.length) select(M.sel >= 0 ? Math.max(0, M.sel - 1) : M.m.notes.length - 1); }
  else if (k === 'ArrowRight') { if (M.sel >= 0 && M.sel < M.m.notes.length - 1) select(M.sel + 1); else { M.sel = -1; M.cursor = M.m.notes.length; highlightSel(); refreshMod(); drawInputStaff(); } }
  else if (k === '+' || k === '=') cycleAcc(1);
  else if (k === '-' || k === '_') cycleAcc(-1);
  else if (k === 'Backspace' || k === 'Delete') delNote();
  else if (k === ' ') togglePlay();
  else if ((k === 'k' || k === 'K') && !e.metaKey && !e.ctrlKey) { modSel.focus(); try { modSel.showPicker(); } catch (err) {} }
  else done = false;
  if (done) { e.preventDefault(); e.stopPropagation(); }
});

/* ───────── 啟動 ───────── */
let saved = null;
try { saved = JSON.parse(localStorage.getItem(STORE_KEY) || 'null'); } catch (e) {}
if (!load(saved)) { applyMode(); buildNav(); chooser.classList.remove('hide'); }
window.__ready = true;
</script>
</body>
</html>
